server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Built files have a hash in their name, so they can be cached for a year.
    # A missing one must be a real 404, not index.html pretending to be JavaScript.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html names the current built files, so the browser must always re-check it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
